<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三副牌升级 · Web GUI v1.2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: #0d6b3e; color: #ecf0f1;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
.top-frame {
  height: 50px; background: #2c3e50;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; flex: 0 0 auto;
}
.title { font-size: 15px; font-weight: 700; margin-right: 4px; white-space: nowrap; }
.subtitle { font-size: 10px; color: #bdc3c7; white-space: nowrap; margin-right: 6px; }
button {
  border: 0; height: 34px; padding: 0 14px; border-radius: 0;
  color: white; cursor: pointer; font-family: inherit; font-size: 12px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-start { background: #27ae60; }
.btn-step { background: #2980b9; }
.btn-auto { background: #34495e; color: #ecf0f1; }
.btn-auto.running { background: #e67e22; color: white; }
.btn-export { background: #34495e; color: #ecf0f1; }
.btn-reset { background: #c0392b; }
.btn-replay { background: #8e44ad; }
.label { font-size: 11px; color: #ecf0f1; white-space: nowrap; }
select, input {
  height: 24px; background: #3d566e; color: white; border: 0; outline: 0;
  font-size: 12px; text-align: center;
}
select { width: 64px; }
input { width: 60px; }
.status-top { flex: 1; text-align: center; font-size: 12px; color: #ecf0f1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas-wrap { flex: 1 1 auto; min-height: 0; padding: 2px; background: #0d6b3e; }
#gameCanvas { display: block; width: 100%; height: 100%; background: #0f7a44; cursor: pointer; }
.status-bar {
  height: 22px; background: #2c3e50; color: #ecf0f1; font-size: 10px;
  padding: 3px 10px; flex: 0 0 auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.hidden { display: none; }
.modal {
  width: 480px; min-height: 380px; background: #1a2a3a; color: #ecf0f1;
  padding: 16px 24px 14px; box-shadow: 0 12px 36px rgba(0,0,0,.35);
}
.modal h2 { text-align: center; color: #f1c40f; font-size: 18px; margin-bottom: 6px; }
.modal .result { text-align: center; color: #f1c40f; font-size: 15px; margin-bottom: 10px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal th, .modal td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #34495e; }
.modal th { color: #bdc3c7; width: 120px; }
.modal .actions { text-align: center; margin-top: 16px; }
.modal .actions button { width: 180px; height: 50px; background: #2980b9; font-size: 14px; font-weight: 700; }
.btn-mini { height: 24px; padding: 0 10px; font-size: 11px; background: #2980b9; }
#gamesTable th { width: auto; text-align: center; }
#gamesTable td { text-align: center; }
#gamesTable thead th { position: sticky; top: 0; background: #1a2a3a; }
#gamesTable tbody tr { cursor: pointer; }
#gamesTable tbody tr:hover { background: #24384d; }
/* 文字记录面板: 记录按钮上方上拉半透明窗口 */
#logPanel {
  position: fixed; right: 12px; bottom: 80px; z-index: 45;
  width: 500px; max-width: calc(100vw - 24px);
  max-height: min(66vh, 620px);
  display: flex; flex-direction: column;
  background: rgba(13, 24, 38, .95);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.5);
  overflow: hidden; font-size: 12px;
}
#logPanel.hidden { display: none; }
.lp-head {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px 7px 14px; background: rgba(255,255,255,.06);
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.lp-title { flex: 1; color: #f1c40f; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-x { height: 24px; width: 24px; padding: 0; border-radius: 6px; background: #c0392b; font-size: 12px; line-height: 1; }
#logBody { overflow: auto; padding: 8px 12px 10px; }
#logBody .r-hdr { font-weight: 700; font-size: 13px; color: #f1c40f; margin: 2px 0 2px; }
#logBody .r-side { color: #bdc3c7; margin-bottom: 4px; }
#logBody .lsect {
  color: #7f8c8d; font-size: 11px; margin: 8px 0 3px;
  display: flex; align-items: center; gap: 6px;
}
#logBody .lsect::before { content: '▍'; color: #2980b9; font-size: 12px; }
#logBody .ln { color: #dbe2ea; line-height: 1.7; }
#logBody .ln b { color: #ecf0f1; }
#logBody .ln.dim { color: #7f8c8d; }
#logBody .k { color: #9aa7b5; margin-right: 6px; }
#logBody .pcards { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 1px; }
#logBody .lchip {
  display: inline-flex; align-items: center; justify-content: center;
  height: 19px; min-width: 26px; padding: 0 3px; box-sizing: border-box;
  background: rgba(255,255,255,.92); border-radius: 4px;
  font-weight: 700; font-size: 11px; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  white-space: nowrap;
}
#logBody .trick {
  margin: 6px 0; padding: 5px 8px 6px;
  background: rgba(255,255,255,.035); border-left: 3px solid #2980b9;
  border-radius: 4px;
}
#logBody .tk-head { color: #ecf0f1; font-weight: 700; margin-bottom: 4px; }
#logBody .tk-head .ptn { color: #5dade2; font-weight: 400; }
#logBody .play { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
#logBody .plab { flex: 0 0 84px; text-align: right; line-height: 1.3; white-space: nowrap; }
#logBody .plab b { color: #ecf0f1; }
#logBody .plab .s { font-size: 9px; padding: 0 3px; border-radius: 3px; margin-left: 3px; }
#logBody .plab .s.dz { background: rgba(241,196,15,.2); color: #f1c40f; }
#logBody .plab .s.ak { background: rgba(93,173,226,.2); color: #5dade2; }
#logBody .plab small { display: block; color: #7f8c8d; font-size: 10px; }
#logBody .play.win { background: rgba(241,196,15,.09); border-radius: 4px; }
#logBody .play.win .plab b { color: #f1c40f; }
#logBody .play.win .plab small { color: #f1c40f; font-weight: 700; }
#logBody .settle { margin-top: 8px; padding: 6px 8px; border-radius: 4px; background: rgba(241,196,15,.08); border: 1px solid rgba(241,196,15,.3); }
#logBody .settle .r-result { color: #f1c40f; font-weight: 700; font-size: 13px; margin-top: 2px; }
#logBody .ln .p-a { color: #e67e22; font-weight: 700; }
#logBody .ln .p-s { color: #f39c12; }
</style>
</head>
<body>
<div class="top-frame">
  <div class="title">🎴 三副牌升级</div>
  <span class="subtitle">v1.2 · 全自动对局</span>
  <button class="btn-start" id="btnStart">▶ 开始</button>
  <button class="btn-step" id="btnStep" disabled>▶ 下一步</button>
  <button class="btn-step" id="btnPrev" style="display:none">⏪ 上一步</button>
  <button class="btn-auto" id="btnAuto" disabled>▶▶ 自动</button>
  <button class="btn-replay" id="btnGames" disabled>📋 对局记录</button>
  <button class="btn-export" id="btnExport" disabled>📊 导出</button>
  <button class="btn-reset" id="btnReset">🔄 重置</button>
  <span class="label">延迟:</span>
  <select id="speedSel">
    <option value="800">慢速</option>
    <option value="400" selected>中速</option>
    <option value="150">快速</option>
    <option value="40">极速</option>
  </select>
  <span class="label">种子:</span><input id="seedInput" placeholder="随机">
  <div class="status-top" id="statusTop">就绪 | 点击「开始」启动游戏</div>
</div>
<div class="canvas-wrap"><canvas id="gameCanvas"></canvas></div>
<div class="status-bar" id="statusBar">就绪 | 点击「开始」启动游戏</div>

<div class="modal-overlay hidden" id="settleModal">
  <div class="modal">
    <h2 id="modalTitle">第 1 局结算</h2>
    <div class="result" id="modalResult"></div>
    <table id="modalTable"></table>
    <div class="actions"><button id="modalContinue">继续</button></div>
  </div>
</div>

<div class="modal-overlay hidden" id="gamesModal">
  <div class="modal">
    <h2>对局记录</h2>
    <div style="max-height:55vh; overflow:auto;">
      <table id="gamesTable">
        <thead>
          <tr><th>局数</th><th>本局级牌</th><th>获胜方</th><th>得分数</th><th>升级数</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions"><button id="gamesClose">关闭</button></div>
  </div>
</div>

<div class="modal-overlay hidden" id="limitModal">
  <div class="modal" style="position:relative">
    <h2 id="limitModalTitle">⚠️ 已达局数上限</h2>
    <button id="limitClose" class="lp-x" title="关闭" style="position:absolute; top:10px; right:10px; background:#c0392b; color:#fff; border-radius:6px; width:24px; height:24px; font-size:12px">✕</button>
    <div class="result" style="margin-top:8px; line-height:1.9; color:#ecf0f1; font-size:13px">
      当前对局数已达上限，如果需要继续对局，请先清空已有局数。<br>
      已存在的对局数据不受影响，可继续使用回放功能查看，您可选择以下操作步骤继续开始新对局
    </div>
    <div class="actions">
      <button id="limitExport" style="background:#27ae60">📊 导出数据</button>
      <button id="limitReset" style="background:#c0392b">🔄 重置对局</button>
    </div>
  </div>
</div>

<div id="logPanel" class="hidden">
  <div class="lp-head">
    <span class="lp-title" id="logTitle">文字记录</span>
    <button id="logClose" class="lp-x" title="关闭">✕</button>
  </div>
  <div id="logBody"></div>
</div>

<button id="btnLive" style="position:fixed; right:90px; bottom:38px; z-index:40; display:none; background:#16a085">⏭ 退出回放</button>
<button id="btnLog" style="position:fixed; right:12px; bottom:38px; z-index:40; display:none; background:#8e44ad">📝 记录</button>

<script>
const SUIT_CN = {'♠':'黑桃','♥':'红桃','♣':'草花','♦':'方块'};
const SCORE_VALUES = {'5':5, '10':10, 'K':10};
const PATTERN_CN = {'single':'单张','pair':'对子','triplet':'刻子','tractor':'拖拉机','bulldozer':'推土机','throw':'甩牌'};
const MAX_RECORDS = 1000;    // 单场累计对局记录上限(达上限需重置才能继续)

let sessionId = null;
let gameData = null;
let autoRunning = false;
let autoTimer = null;
let speed = 400;
let modalShownFor = null;
let revealNum = -1;      // 当前正在逐张亮牌的一圈编号
let revealShown = 0;     // 已亮到第几位玩家
let animating = false;   // 是否正在亮牌动画中
let animTimer = null;
let lastRound = -1;
let logOpen = false;    // 文字记录面板是否展开
let logRnd = -1;        // 面板当前展示的局
let logLive = -1;       // 面板加载时引擎 live 步数 (仅同局增长时重载)

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderCanvas();
}
window.addEventListener('resize', resizeCanvas);

function colorFor(card) {
  if (!card) return '#1a1a2e';
  if (card.rank === '大王') return '#c0392b';
  if (card.rank === '小王') return '#1a1a2e';
  return (card.suit === '♥' || card.suit === '♦') ? '#c0392b' : '#1a1a2e';
}

function isMainCard(card) {
  const rr = gameData?.round_record;
  if (!card || !rr || !rr.level) return false;
  if (card.rank === '大王' || card.rank === '小王') return true;
  if (card.rank === rr.level) return true;
  if (card.rank === '2') return true;
  if (rr.trump_suit && card.suit === rr.trump_suit) return true;
  return false;
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawText(c, text, x, y, font, color, align = 'center', baseline = 'middle') {
  c.font = font; c.fillStyle = color;
  c.textAlign = align; c.textBaseline = baseline;
  c.fillText(text, x, y);
}

function cardLabel(card) {
  if (card.rank === '大王' || card.rank === '小王') return card.rank;
  return `${card.rank}${card.suit}`;
}

// 迷你手牌
function drawMiniCard(c, x, y, card, opts = {}) {
  const w = opts.w || 24, h = opts.h || 36;
  roundRectPath(c, x, y, w, h, 3);
  c.fillStyle = 'white'; c.fill();
  c.strokeStyle = opts.highlight ? '#e74c3c' : '#bdc3c7';
  c.lineWidth = opts.highlight ? 2 : 1;
  c.stroke();
  c.fillStyle = colorFor(card);
  if (opts.topLabel) {
    c.font = opts.topFont || 'bold 9px "Microsoft YaHei"';
    c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText(cardLabel(card), x + 2, y + 1);
  } else {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = 'bold 11px "Microsoft YaHei"';
    c.fillText(cardLabel(card), x + w / 2, y + h / 2);
  }
  if (isMainCard(card)) {
    c.fillStyle = '#f1c40f';
    c.font = '7px "Microsoft YaHei"';
    if (opts.starTR) {
      // 竖排手牌(侧边玩家2/4): 底部被下一张牌盖住, 星标放右上角
      c.textAlign = 'right'; c.textBaseline = 'top';
      c.fillText('★', x + w - 3, y + 2);
    } else {
      c.textAlign = 'left'; c.textBaseline = 'bottom';
      c.fillText('★', x + 2, y + h - 2);
    }
  }
}

// 桌面中央大牌
function drawBigCard(c, x, y, card, opts = {}) {
  const w = 56, h = 80;
  roundRectPath(c, x, y, w, h, 5);
  c.fillStyle = 'white'; c.fill();
  c.strokeStyle = opts.highlight ? '#e74c3c' : '#bdc3c7';
  c.lineWidth = opts.highlight ? 2.5 : 1;
  c.stroke();
  c.fillStyle = colorFor(card);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (card.rank === '大王' || card.rank === '小王') {
    c.font = 'bold 17px "Microsoft YaHei"';
  } else {
    c.font = 'bold 22px "Segoe UI Symbol", "Microsoft YaHei"';
  }
  c.fillText(cardLabel(card), x + w / 2, y + h / 2);
  if (isMainCard(card)) {
    c.fillStyle = '#f1c40f';
    c.font = '14px "Microsoft YaHei"';
    c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText('★', x + 4, y + h - 6);
  }
}

// 牌背
function drawCardBack(c, x, y, w, h) {
  roundRectPath(c, x, y, w, h, 3);
  c.fillStyle = '#9b59b6'; c.fill();
  c.strokeStyle = '#bdc3c7'; c.lineWidth = 1; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)';
  c.fillRect(x + 3, y + 3, w - 6, 4);
}

function hand(pid) { return gameData?.hands?.[String(pid)] || []; }

function renderCanvas() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 1280, h = rect.height || 830;
  const cx = w / 2, cy = h / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0f7a44';
  ctx.fillRect(0, 0, w, h);

  if (!gameData) return;
  const rr = gameData.round_record;

  drawInfoPanel(w, h, cx, cy);
  if (rr) drawBottomStrip(w, h);
  drawBottomInfo(w, h, cx, cy);   // 底牌下方: 埋底/炒底信息 (始终显示)

  if (['trump','bury','stir'].includes(gameData.state)) {
    drawPhaseEvents(w, h, cx, cy);   // 亮主/反主牌面 + 炒底资格牌
  }

  // 手牌
  drawHandRow(hand(0), h - 22, 26, 38, false, w);
  drawHandRow(hand(2), 40, 24, 34, true, w);
  drawSideFan(3, 26, cy, 28, 40);
  drawSideFan(1, w - 26, cy, 28, 40);

  if (['playing','settled'].includes(gameData.state)) {
    drawCenter(w, h, cx, cy);
  }
  if (gameData.game_over) drawGameOver(w, h);
  else if (gameData.limit_reached) drawLimitOverlay(w, h);
}

function drawInfoPanel(w, h, cx, cy) {
  const rr = gameData.round_record;
  const x = 10;
  let y0 = 14;
  // 回放态: 牌桌左上角红色小标志
  if (gameData.replay) {
    const txt = '🔴 回放中';
    ctx.font = 'bold 13px "Microsoft YaHei"';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRectPath(ctx, x - 3, y0 - 11, tw + 12, 22, 5);
    ctx.fill();
    drawText(ctx, txt, x + 3, y0, 'bold 13px "Microsoft YaHei"', '#ff6b6b', 'left');
    y0 += 28;
  }
  let lines = [];
  lines.push(`第 ${gameData.round} 局`);
  if (rr) lines.push(`打 ${rr.level}`);
  if (rr) lines.push(`主: ${rr.trump_suit_cn || '无主'}`);
  lines.push(`庄家: 玩家${gameData.dealer_pid + 1}`);
  lines.push(`队伍A: ${gameData.team_a_level}`);
  lines.push(`队伍B: ${gameData.team_b_level}`);
  lines.forEach((t, i) => drawText(ctx, t, x, y0 + i * 18, 'bold 12px "Microsoft YaHei"', '#ecf0f1', 'left'));
  // 已收分
  if (rr && gameData.state !== 'trump') {
    drawText(ctx, `闲家已得 ${rr.attacker_score} 分`, x, y0 + lines.length * 18 + 2,
      'bold 12px "Microsoft YaHei"', '#f39c12', 'left');
  }
}

function drawBottomStrip(w, h) {
  const rr = gameData.round_record;
  if (!rr) return;
  const bottom = gameData.bottom || [];
  if (!bottom.length) return;
  const cx = w / 2, cy = h / 2;                 // 底牌放桌布中心点
  const cw = 28, ch = 42, gap = 3;
  const total = bottom.length * (cw + gap) - gap;
  const x0 = cx - total / 2;
  const y = cy - ch / 2;
  // 淡色衬底, 标明是中央底牌区
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  roundRectPath(ctx, x0 - 8, y - 8, total + 16, ch + 14, 8);
  ctx.fill();
  bottom.forEach((card, i) => drawMiniCard(ctx, x0 + i * (cw + gap), y, card, {w: cw, h: ch}));
  const score = bottom.reduce((s, c) => s + ({5: 5, 10: 10, K: 10}[c.rank] || 0), 0);
  drawText(ctx, `底牌 ${score}分`, cx, y - 14, 'bold 11px "Microsoft YaHei"', '#f1c40f');
}

// 底牌下方: 埋底/炒底信息。阶段中逐步展示(跟随炒底进度), 游戏开始(playing/settled)后只保留最后一条。
// 信息框以 cx 水平居中, 与底牌背景框同一轴线对齐。
function drawBottomInfo(w, h, cx, cy) {
  const rr = gameData.round_record;
  if (!rr) return;
  const events = rr.stir_events || [];
  const buryLine = () => {
    if (typeof rr.bury_pid !== 'number' || !rr.buried_cards || !rr.buried_cards.length) return null;
    const cards = rr.buried_cards.map(cardLabel).join(' ');
    return `📦 庄家(玩家${rr.bury_pid + 1}) 埋底: ${cards}`;
  };
  const stirLine = e => {
    const taken = (e.taken || []).map(cardLabel).join(' ');
    const disc = (e.discarded || []).map(cardLabel).join(' ');
    const act = e.action === '反炒' ? '反炒' : '炒底';
    return `🍳 玩家${e.pid + 1} ${e.label}${act}: 换入 ${taken} | 弃出 ${disc}`;
  };
  let lines = [];
  if (gameData.state === 'playing' || gameData.state === 'settled') {
    // 出牌开始后只保留最后一条: 取最后一条炒底; 无炒底则保留埋底
    if (events.length) lines.push(stirLine(events[events.length - 1]));
    else lines.push(buryLine());
  } else {
    const b = buryLine();
    if (b) lines.push(b);
    events.slice(0, gameData.stir_revealed || 0).forEach(e => lines.push(stirLine(e)));
  }
  lines = lines.filter(Boolean);
  if (!lines.length) return;
  const y0 = cy + 40;
  ctx.font = '11px "Microsoft YaHei"';
  const maxW = Math.max(...lines.map(t => ctx.measureText(t).width));
  const lineH = 18, padX = 10, padY = 6;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  // 框以文本块中心对齐: 文本行中心在 y0+i*lineH, 块中心 = y0 + (n-1)*lineH/2;
  // 框顶 = 块中心 - 框高/2 = y0 - lineH/2 - padY (之前漏了 lineH/2 导致框整体下移 9px)
  const boxY = y0 - lineH / 2 - padY;
  roundRectPath(ctx, cx - maxW / 2 - padX, boxY, maxW + padX * 2, lines.length * lineH + padY * 2, 8);
  ctx.fill();
  lines.forEach((t, i) => drawText(ctx, t, cx, y0 + i * lineH, '11px "Microsoft YaHei"', '#e8d9a0'));
}

// 玩家出牌区中心位置 (0下/1右/2上/3左)
function phasePos(pid, w, h, cx, cy) {
  const xOff = Math.min(360, Math.max(240, w * 0.28));
  const topY = Math.max(150, Math.min(210, h * 0.26));
  const bottomY = Math.min(h - 110, Math.max(cy + 100, h * 0.66));
  return {
    0: [cx, bottomY],         // 下家(玩家1)
    1: [cx + xOff, cy - 40],  // 右家(玩家2)
    2: [cx, topY],            // 上家(玩家3)
    3: [cx - xOff, cy - 40],  // 左家(玩家4)
  }[pid];
}

// 阶段事件: 亮主/反主牌面 + 炒底资格牌 + 埋底/炒底记录 (仅 trump/bury/stir 阶段)
function drawPhaseEvents(w, h, cx, cy) {
  const rr = gameData.round_record;

  // 1) 亮主/反主: 在对应玩家的出牌区展示级牌, 牌组正下方显示动作名
  const cc = gameData.current_call;
  if (cc && rr && rr.level) {
    const pos = phasePos(cc.pid, w, h, cx, cy);
    if (pos) {
      const cw = 30, ch = 44, gap = 2;
      const total = cc.count * (cw + gap) - gap;
      const x0 = pos[0] - total / 2;
      const card = {suit: cc.suit, rank: rr.level};   // 级牌
      for (let i = 0; i < cc.count; i++) {
        drawMiniCard(ctx, x0 + i * (cw + gap), pos[1] - ch / 2, card, {w: cw, h: ch, highlight: true});
      }
      drawText(ctx, cc.action, pos[0], pos[1] + ch / 2 + 16,
        'bold 14px "Microsoft YaHei"', '#f1c40f');
    }
  }

  // 2) 炒底资格牌: 在炒底者出牌区亮出炒牌 (大王/小王/级牌), 下方标注炒底牌型
  const cs = gameData.current_stir;
  if (cs && cs.qualify && cs.qualify.length) {
    const pos = phasePos(cs.pid, w, h, cx, cy);
    if (pos) {
      const cw = 34, ch = 50, gap = 3;
      const total = cs.qualify.length * (cw + gap) - gap;
      const x0 = pos[0] - total / 2;
      cs.qualify.forEach((card, i) => {
        drawMiniCard(ctx, x0 + i * (cw + gap), pos[1] - ch / 2, card, {w: cw, h: ch, highlight: true});
      });
      const act = cs.action === '反炒' ? '反炒' : '炒底';
      drawText(ctx, `${act}·${cs.label}`, pos[0], pos[1] + ch / 2 + 16,
        'bold 13px "Microsoft YaHei"', '#f39c12');
    }
  }
}

// 一行手牌 (自适应宽度)
function drawHandRow(cards, y, baseW, baseH, isTop, w) {
  if (!cards.length) return;
  const gap = 2;
  const avail = w - 60;
  const cw = Math.min(baseW, Math.max(13, Math.floor(avail / cards.length) - gap));
  const ch = Math.round(cw * 1.5);
  if (!isTop) {
    // 底部玩家手牌: 上移到画布内, 保证整张牌与下方标签都完整显示
    const rect = canvas.getBoundingClientRect();
    const h = rect.height || 830;
    y = h - ch - 18;
  }
  const total = cards.length * (cw + gap) - gap;
  const x0 = (w - total) / 2;
  cards.forEach((card, i) => drawMiniCard(ctx, x0 + i * (cw + gap), y, card, {w: cw, h: ch}));
  if (isTop) {
    drawText(ctx, `玩家${3}${gameData.dealer_pid === 2 ? ' (庄)' : ''} (${cards.length})`,
      w / 2, y - 8, 'bold 11px "Microsoft YaHei"', '#ecf0f1');
  } else {
    drawText(ctx, `玩家${1}${gameData.dealer_pid === 0 ? ' (庄)' : ''} (${cards.length})`,
      w / 2, y + ch + 14, 'bold 11px "Microsoft YaHei"', '#ecf0f1');
  }
}

// 左右两侧: 展示全部手牌(正摆放竖排, 一列摆不下自动分两列)
function drawSideFan(pid, x, cy, cw, ch) {
  const cards = hand(pid);
  const n = cards.length;
  if (!n) {
    drawText(ctx, `玩家${pid + 1}`, x, cy, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const h = rect.height || 830;
  const isLeft = pid === 3;
  // 左右两侧玩家的整体纵向起点: 下移避开左上角信息面板(回放态含「🔴 回放中」横幅/已收分行)
  const yTop = 184;
  const yBottom = Math.max(yTop + 80, h - 172);
  const span = yBottom - yTop;
  const baseStep = 18;                          // 相邻牌上下重叠, 每张露出 18px
  const maxPerCol = Math.floor(span / baseStep) || 1;   // 一列最多张数
  const cols = n > maxPerCol ? 2 : 1;
  const perCol = Math.ceil(n / cols);
  const step = Math.min(baseStep, span / perCol);       // 放不下时压缩重叠
  const gap = 2;
  const y0 = yTop + (span - (perCol - 1) * step) / 2;   // 垂直居中
  // 左侧玩家列靠左排, 右侧玩家列靠右排
  const x0 = isLeft ? x : x - cols * cw - (cols - 1) * gap;
  const topFont = 'bold 9px "Microsoft YaHei"';
  for (let i = 0; i < n; i++) {
    const col = Math.floor(i / perCol);
    const idx = i % perCol;
    const xx = x0 + col * (cw + gap);
    const yy = y0 + idx * step;
    drawMiniCard(ctx, xx, yy, cards[i], {w: cw, h: ch, topLabel: true, topFont, starTR: true});
  }
  const blockW = cols * cw + (cols - 1) * gap;
  const titleX = isLeft ? x + blockW / 2 : x - blockW / 2;
  const dealer = gameData.dealer_pid === pid;
  drawText(ctx, `玩家${pid + 1}${dealer ? ' (庄)' : ''} · ${n}张`,
    titleX, yTop - 18, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
}

// 出牌操作名 (毙牌/盖毙/甩牌/甩牌失败等) 在牌组下方的小标签
const ACTION_COLOR = {
  'kill': '#f1c40f', 'kill_throw': '#f1c40f', 'over_kill': '#e74c3c',   // 毙牌家族黄色, 盖毙红色
  'throw': '#00bcd4', 'throw_fail': '#e67e22',
};

function drawActionTag(px, py, action, actionCn) {
  ctx.font = 'bold 12px "Microsoft YaHei"';
  const color = ACTION_COLOR[action] || '#ecf0f1';
  const w = ctx.measureText(actionCn).width + 14;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRectPath(ctx, px - w / 2, py - 10, w, 20, 5);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(actionCn, px, py);
}

function drawCenter(w, h, cx, cy) {
  const t = gameData.current_trick;
  const rr = gameData.round_record;
  if (t) {
    const xOff = Math.min(360, Math.max(240, w * 0.28));
    const topY = Math.max(150, Math.min(210, h * 0.26));
    const bottomY = Math.min(h - 110, Math.max(cy + 100, h * 0.66));
    const positions = {
      0: [cx, bottomY],        // 下家
      1: [cx + xOff, cy - 40], // 右家
      2: [cx, topY],           // 上家
      3: [cx - xOff, cy - 40], // 左家
    };
    for (let pi = 0; pi < t.played.length; pi++) {
      if (pi >= revealShown) break;          // 逐位亮牌: 只显示已出的玩家
      const play = t.played[pi];
      const cl = play.cards || [];
      if (!cl.length) continue;
      const [px, py] = positions[play.pid];
      // 红框(本圈最大)只在 4 家都出完牌后才显示, 亮牌过程中不预先高亮胜家
      const isWinner = revealShown >= t.played.length && t.winner === play.pid;
      const perRow = 8;                       // 一行最多 8 张
      const gap = 44;                         // 相邻牌仅重叠 12px, 尽量露出完整牌面
      const rowH = 88;                        // 行距: 牌高 80 + 行间距 8
      const rows = Math.ceil(cl.length / perRow);
      const yBase = py - ((rows - 1) * rowH) / 2;   // 多行以锚点垂直居中
      let lastRowY = py;
      for (let r = 0; r < rows; r++) {
        const slice = cl.slice(r * perRow, Math.min((r + 1) * perRow, cl.length));
        const totalW = slice.length * gap + 56 - gap;
        const startX = px - totalW / 2;
        const y = yBase + r * rowH;
        slice.forEach((card, j) => drawBigCard(ctx, startX + j * gap, y, card, {highlight: isWinner}));
        if (r === rows - 1) lastRowY = y;
      }
      // 出牌操作名 (毙牌/甩牌/甩牌失败等) 显示在牌组下方
      const cardBottom = lastRowY + 80;                 // 大牌高 80px, 牌组底边
      if (play.action_cn) {
        drawActionTag(px, cardBottom + 12, play.action, play.action_cn);   // 标签顶部留 2px 间隙, 不压牌
      }
      if (isWinner) {
        const tagBottom = cardBottom + 22;              // 标签底边 (12 + 半高10)
        drawText(ctx, `玩家${play.pid + 1}`, px,
          (play.action_cn ? tagBottom + 12 : cardBottom + 12),
          'bold 11px "Microsoft YaHei"', '#f39c12');
      }
    }
  }
  if (gameData.state === 'settled' && rr && trickRevealed()) drawSettlement(w, h, cx, cy);
}

function drawSettlement(w, h, cx, cy) {
  const rr = gameData.round_record;
  const lines = [];
  lines.push(`闲家得分: ${rr.attacker_score}`);
  if (rr.koudi) lines.push(`抠底 ${rr.koudi_pattern} 底分${rr.bottom_score} × ${rr.koudi_multiplier}`);
  if (rr.dealer_up > 0) lines.push(`庄家方 +${rr.dealer_up}级`);
  if (rr.attacker_up > 0) lines.push(`闲家方 +${rr.attacker_up}级`);
  if (rr.side_switch) lines.push(`庄权交接 → 新庄家玩家${gameData.dealer_pid + 1}`);
  lines.push(rr.result);
  const lineH = 25;
  const y0 = Math.max(92, cy - 175);   // 避开中央底牌区, 结案文字显示在底牌上方
  let maxW = 0;
  lines.forEach((t, i) => {
    ctx.font = `bold ${i === lines.length - 1 ? 15 : 12}px "Microsoft YaHei"`;
    maxW = Math.max(maxW, ctx.measureText(t).width);
  });
  // 半透明深色衬底, 即使与最后一圈牌重叠也清晰可读
  const padX = 18, padY = 12;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRectPath(ctx, cx - maxW / 2 - padX, y0 - padY,
    maxW + padX * 2, lines.length * lineH + padY * 2, 10);
  ctx.fill();
  lines.forEach((t, i) => drawText(ctx, t, cx, y0 + i * lineH,
    `bold ${i === lines.length - 1 ? 15 : 12}px "Microsoft YaHei"`,
    i === lines.length - 1 ? '#f1c40f' : '#f39c12'));
}

function drawGameOver(w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, w, h);
  drawText(ctx, `🏆 ${gameData.winner || '游戏结束'}`, w / 2, h / 2 - 20,
    'bold 32px "Microsoft YaHei"', '#f1c40f');
  drawText(ctx, `共 ${gameData.round} 局 | 队伍A:${gameData.team_a_level} 队伍B:${gameData.team_b_level}`,
    w / 2, h / 2 + 30, '14px "Microsoft YaHei"', '#ecf0f1');
  drawText(ctx, '点击「重置」重新开始', w / 2, h / 2 + 60, '12px "Microsoft YaHei"', '#bdc3c7');
}

// 达上限后的画布提示: 叠加半透明提示带, 回放/导出仍可用, 开始新对局需先重置
function drawLimitOverlay(w, h) {
  const msg = [`⚠️ 已达 ${MAX_RECORDS} 局上限`, '回放 / 导出仍可用 · 重置后才能开始新对局'];
  const lineH = 30, padY = 16;
  const boxH = msg.length * lineH + padY * 2;
  const y0 = Math.max(200, h / 2 - 40);
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, y0 - boxH / 2, w, boxH);
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(0, y0 - boxH / 2, 6, boxH);
  msg.forEach((t, i) => drawText(ctx, t, w / 2, y0 - boxH / 2 + padY + i * lineH,
    `bold ${i === 0 ? 22 : 13}px "Microsoft YaHei"`,
    i === 0 ? '#f1c40f' : '#ecf0f1'));
}

function syncStatus() {
  const text = gameData?.status || '就绪 | 点击「开始」启动游戏';
  document.getElementById('statusTop').textContent = text;
  document.getElementById('statusBar').textContent = text;
}

function render() {
  syncStatus();
  updateReplayUI();
  renderCanvas();
}

function trickRevealed() {
  const t = gameData?.current_trick;
  if (!t) return true;
  return revealNum === t.num && revealShown >= t.played.length;
}

// 一圈出牌: 玩家逐个亮牌(一个一个出)。第一家立即亮出, 后续按延迟逐家出。
function animateTrick(done) {
  const t = gameData?.current_trick;
  if (!t) { done(); return; }
  if (revealNum !== t.num) {
    revealNum = t.num;
    revealShown = 0;
  }
  revealShown = 1;                 // 第一家立刻亮, 点击后不用等
  renderCanvas();
  if (revealShown >= t.played.length) { done(); return; }
  const step = () => {
    revealShown++;
    renderCanvas();
    if (revealShown >= t.played.length) done();
    else animTimer = setTimeout(step, speed);
  };
  animTimer = setTimeout(step, speed);
}

async function advance() {
  if (!sessionId || animating || gameData?.limit_reached) return;
  animating = true;
  closeModal();
  if (gameData && lastRound !== gameData.round) { revealNum = -1; revealShown = 0; }
  gameData = await apiCall('api/step', {session_id: sessionId});
  refreshLogIfOpen();
  if (gameData.error) { animating = false; return; }
  if (gameData.limit_reached) {            // 达 1000 局上限: 冻结, 弹窗提示(需重置才能继续)
    stopAuto();
    setButtons(false);                     // ▶开始可点(点击弹上限提示), 导出可用
    render();
    animating = false;
    openLimitModal();
    return;
  }
  if (gameData.game_over) { stopAuto(); render(); animating = false; return; }
  lastRound = gameData.round;
  if (!gameData.current_trick) {
    revealNum = -1; revealShown = 0;
    render();
    animating = false;
    onTrickDone();
    return;
  }
  render();
  animateTrick(() => { animating = false; onTrickDone(); });
}

function onTrickDone() {
  if (gameData?.state === 'settled' && !autoRunning) showSettlementModal();
  if (autoRunning && !gameData?.game_over) autoTimer = setTimeout(advance, speed);
}

async function doStep() {
  if (!sessionId || autoRunning || animating || gameData?.game_over) return;
  if (gameData?.limit_reached) { openLimitModal(); return; }   // 已冻结: 需先重置
  await advance();
}

// 上一步: 回到上一个快照 (仅回放态可用), 直接渲染不播亮牌动画
async function doPrev() {
  if (!sessionId || autoRunning || animating || !gameData?.can_prev) return;
  gameData = await apiCall('api/prev', {session_id: sessionId});
  refreshLogIfOpen();
  if (!gameData.current_trick) {
    revealNum = -1; revealShown = 0;
  } else if (revealNum !== gameData.current_trick.num) {
    revealNum = gameData.current_trick.num;
    revealShown = gameData.current_trick.played.length;   // 回退到的圈整圈亮出
  }
  closeModal();
  render();
}

// 退出回放: 回到直播前沿 (只移游标), 直接渲染不播亮牌动画
async function doLive() {
  if (!sessionId || autoRunning || animating || !gameData?.replay) return;
  gameData = await apiCall('api/live', {session_id: sessionId});
  if (!gameData.current_trick) {
    revealNum = -1; revealShown = 0;
  } else if (revealNum !== gameData.current_trick.num) {
    revealNum = gameData.current_trick.num;
    revealShown = gameData.current_trick.played.length;   // 回到前沿时当前圈整圈亮出
  }
  closeModal();
  render();
}

function showSettlementModal() {
  const rr = gameData.round_record;
  if (!rr) return;
  modalShownFor = gameData.round;
  document.getElementById('modalTitle').textContent = `第 ${rr.rnd} 局结算`;
  document.getElementById('modalResult').textContent = rr.result || '';
  const rows = [
    ['本局级牌', `打 ${rr.level}`],
    ['主花色', `${rr.trump_suit_cn || '无主'}`],
    ['庄家方', `玩家${rr.dt[0] + 1}、玩家${rr.dt[1] + 1}`],
    ['闲家方', `玩家${rr.at[0] + 1}、玩家${rr.at[1] + 1}`],
    ['闲家得分', `${rr.attacker_score} 分`],
    ['抠底', rr.koudi ? `${rr.bottom_score} 分 × ${rr.koudi_multiplier} 倍` : '无'],
    ['庄家方升级', `+${rr.dealer_up}`],
    ['闲家方升级', `+${rr.attacker_up}`],
    ['庄权交接', rr.side_switch ? `新庄家玩家${gameData.dealer_pid + 1}` : '庄家方守庄'],
    ['队伍等级', `队伍A:${rr.team_a_level_after}  队伍B:${rr.team_b_level_after}`],
    ['圈数', `${rr.tricks_count} 圈`],
  ];
  document.getElementById('modalTable').innerHTML =
    '<tr><th>项目</th><th>值</th></tr>' + rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  document.getElementById('settleModal').classList.remove('hidden');
}

function closeModal() { document.getElementById('settleModal').classList.add('hidden'); }

// ---- 已达上限弹窗: 只能 导出数据 / 重置对局, 或 ✕ 关闭后继续回放 ----
function openLimitModal() {
  closeModal();
  closeGames();
  document.getElementById('limitModalTitle').textContent = `⚠️ 已达 ${MAX_RECORDS} 局上限`;
  document.getElementById('limitModal').classList.remove('hidden');
}
function closeLimitModal() { document.getElementById('limitModal').classList.add('hidden'); }

// 导出全部对局记录为 Excel (达上限后同样可用)
async function doExport() {
  if (!sessionId) return;
  closeLimitModal();
  closeModal();
  closeGames();
  const res = await fetch('api/export', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId}),
  });
  if (!res.ok) {
    let msg = '导出失败';
    try { const d = await res.json(); if (d.error) msg = d.error; } catch (e) {}
    alert(msg);
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const cd = res.headers.get('Content-Disposition') || '';
  const m = /filename="?([^";]+)"?/.exec(cd);
  a.download = m ? m[1] : '三副牌升级.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---- 回放 UI ----

// 上一步/退出回放/记录按钮仅回放态显示; 对局记录有会话且非自动播放时可用
function updateReplayUI() {
  const replay = !!gameData?.replay;
  document.getElementById('btnPrev').style.display = replay ? '' : 'none';
  document.getElementById('btnPrev').disabled = !gameData?.can_prev;
  document.getElementById('btnLog').style.display = replay ? '' : 'none';
  document.getElementById('btnLive').style.display = replay ? '' : 'none';
  document.getElementById('btnGames').disabled = !sessionId || autoRunning;
  if (!replay && logOpen) hideLog();   // 离开回放态自动收起文字面板
}

async function openGames() {
  if (!sessionId) return;
  if (autoRunning) stopAuto();
  const resp = await fetch(`api/games?session_id=${sessionId}`);
  const data = await resp.json();
  if (data.error) { alert(data.error); return; }
  const tbody = document.querySelector('#gamesTable tbody');
  tbody.innerHTML = '';
  (data.games || []).forEach(g => {
    const tr = document.createElement('tr');
    tr.dataset.rnd = g.rnd;
    const ups = g.in_progress ? '—' : `庄+${g.dealer_up} 闲+${g.attacker_up}`;
    const cells = [g.rnd, `打 ${g.level}`, g.winner,
                   g.in_progress ? '进行中' : `${g.score} 分`, ups];
    cells.forEach(t => {
      const td = document.createElement('td');
      td.textContent = t;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = '回放';
    btn.className = 'btn-mini';
    btn.addEventListener('click', e => { e.stopPropagation(); replayRound(g.rnd); });
    td.appendChild(btn);
    tr.appendChild(td);
    tr.addEventListener('click', () => replayRound(g.rnd));
    tbody.appendChild(tr);
  });
  document.getElementById('gamesModal').classList.remove('hidden');
}

function closeGames() { document.getElementById('gamesModal').classList.add('hidden'); }

// 回放某一局: 后端把游标跳到该局初始快照, 前端从头渲染
async function replayRound(rnd) {
  if (!sessionId || animating) return;
  if (autoRunning) stopAuto();
  const resp = await apiCall('api/replay', {session_id: sessionId, rnd});
  if (resp.error) { alert(resp.error); return; }
  gameData = resp;
  closeGames();
  refreshLogIfOpen();
  revealNum = -1; revealShown = 0;
  if (gameData.current_trick) {
    revealNum = gameData.current_trick.num;
    revealShown = gameData.current_trick.played.length;
  }
  render();
}

// ---- 文字记录面板 (回放态右下角上拉, 半透明) ----

function hideLog() {
  logOpen = false;
  document.getElementById('logPanel').classList.add('hidden');
}

// 记录按钮: 展开/收起切换; 展开时拉取当前所看局的事件流并渲染
async function toggleLog() {
  if (!sessionId || !gameData) return;
  if (logOpen) { hideLog(); return; }
  if (await loadLog()) {
    logOpen = true;
    document.getElementById('logPanel').classList.remove('hidden');
  }
}

// 拉取并渲染第 gameData.round 局的文字记录 (事件流已结构化, 前端排版); 成功返回 true
async function loadLog() {
  if (!sessionId || !gameData) return false;
  const rnd = gameData.round;
  const resp = await fetch(`api/logs?session_id=${sessionId}&rnd=${rnd}`);
  const data = await resp.json();
  if (data.error) { alert(data.error); return false; }
  renderLogBody(rnd, data.events || []);
  document.getElementById('logTitle').textContent = `第 ${rnd} 局 · 文字记录`;
  logRnd = rnd;
  logLive = gameData.live_steps || 0;
  return true;
}

// 导航后若面板开着且换局/同局推进到新内容 → 重载
function refreshLogIfOpen() {
  if (!logOpen || !sessionId || !gameData) return;
  const rnd = gameData.round;
  const live = gameData.live_steps || 0;
  if (rnd === logRnd && live <= logLive) return;
  loadLog();
}

function lpChip(c) {
  if (!c) return '';
  const col = c.rank === '大王' ? '#c0392b'
            : c.rank === '小王' ? '#34495e'
            : (c.suit === '♥' || c.suit === '♦') ? '#c0392b' : '#1a1a2e';
  const lab = (c.rank === '大王' || c.rank === '小王') ? c.rank : `${c.rank}${c.suit}`;
  return `<span class="lchip" style="color:${col}">${lab}</span>`;
}
function lpChips(cards) { return (cards || []).map(lpChip).join(''); }

// 事件流 → 按局/圈分组、玩家对玩家、牌对牌的 HTML
function renderLogBody(rnd, evs) {
  const html = [];
  const sides = {};                                  // pid -> 庄/闲
  let dt = [], at = [];
  (evs || []).forEach(e => { if (e.type === 'round') { dt = e.dt; at = e.at; } });
  (dt || []).forEach(p => sides[p] = '庄');
  (at || []).forEach(p => sides[p] = '闲');

  const roleMark = p => sides[p]
    ? `<span class="s ${sides[p] === '庄' ? 'dz' : 'ak'}">${sides[p]}</span>` : '';

  for (const e of evs) {
    if (e.type === 'round') {
      html.push(`<div class="r-hdr">第 ${e.rnd} 局 · 庄家 玩家${e.dealer_pid + 1} · 打 ${e.level}</div>`);
      html.push(`<div class="r-side">庄家方: ${dt.map(p => `玩家${p + 1}`).join('、')}`
              + `　│　闲家方: ${at.map(p => `玩家${p + 1}`).join('、')}</div>`);
    } else if (e.type === 'trump') {
      html.push(`<div class="lsect">叫主</div>`);
      if (e.calls && e.calls.length) {
        const seq = e.calls.map(c =>
          `<span class="ln">${c.action}<b> 玩家${c.pid + 1}</b> ${c.count}张${c.suit}</span>`).join(' → ');
        html.push(`<div class="ln">${seq}</div>`);
        html.push(`<div class="ln">主花色: <b>${SUIT_CN[e.suit] || e.suit || '无主'}</b></div>`);
      } else {
        html.push(`<div class="ln dim">无人叫主 → 本局打<b>无主</b></div>`);
      }
    } else if (e.type === 'bury') {
      html.push(`<div class="lsect">埋底 · 庄家(玩家${e.pid + 1}) · 底分 ${e.score}</div>`);
      html.push(`<div class="pcards">${lpChips(e.cards)}</div>`);
    } else if (e.type === 'stir') {
      if (e.items && e.items.length) {
        e.items.forEach((it, ix) => {
          const act = it.action === '反炒' ? '反炒' : '炒底';
          html.push(`<div class="lsect">${act}${e.items.length > 1 ? ` ${ix + 1}` : ''} · `
                  + `玩家${it.pid + 1} 以 <span class="ln p-s">${it.label}</span> ${act}</div>`);
          html.push(`<div class="ln"><span class="k">换入</span><div class="pcards">${lpChips(it.taken)}</div></div>`);
          html.push(`<div class="ln"><span class="k">弃出</span><div class="pcards">${lpChips(it.discarded)}</div></div>`);
        });
        html.push(`<div class="ln dim">炒底后底分 ${e.final_score}</div>`);
      } else {
        html.push(`<div class="lsect">炒底</div>`);
        html.push(`<div class="ln dim">无人炒底</div>`);
      }
    } else if (e.type === 'trick') {
      html.push(`<div class="trick">`);
      html.push(`<div class="tk-head">第 ${e.num} 圈${e.pattern_cn ? ` <span class="ptn">· ${e.pattern_cn}</span>` : ''}</div>`);
      (e.plays || []).forEach(pl => {
        if (!pl.cards || !pl.cards.length) return;
        const isWin = pl.pid === e.winner;
        const note = isWin ? `胜 +${e.score}分`
                  : pl.action_cn ? pl.action_cn : '';
        html.push(`<div class="play${isWin ? ' win' : ''}">`);
        html.push(`  <div class="plab"><b>玩家${pl.pid + 1}</b>${roleMark(pl.pid)}`
                + `${note ? `<small>${note}</small>` : '<small></small>'}</div>`);
        html.push(`  <div class="pcards">${lpChips(pl.cards)}</div>`);
        html.push(`</div>`);
      });
      html.push(`</div>`);
    } else if (e.type === 'settle') {
      html.push(`<div class="settle">`);
      html.push(`<div class="ln">闲家得分 <b>${e.attacker_score}</b></div>`);
      if (e.koudi) {
        html.push(`<div class="ln dim">抠底 ${e.koudi_pattern_cn || ''} · 底分${e.bottom_score} × ${e.koudi_multiplier}</div>`);
      }
      html.push(`<div class="ln">庄家方 ${e.dealer_up ? `+${e.dealer_up}级` : '—'}　│　`
              + `闲家方 ${e.attacker_up ? `+${e.attacker_up}级` : '—'}</div>`);
      if (e.side_switch) html.push(`<div class="ln dim">庄权交接 → 新庄家</div>`);
      html.push(`<div class="r-result">${e.result}</div>`);
      html.push(`</div>`);
    }
  }
  document.getElementById('logBody').innerHTML = html.join('');
  document.getElementById('logBody').scrollTop = 0;
}

function setButtons(running) {
  document.getElementById('btnStart').disabled = running;
  document.getElementById('btnStep').disabled = !running || autoRunning;
  document.getElementById('btnAuto').disabled = !running;
  document.getElementById('btnExport').disabled = !running && !sessionId;   // 有会话即可导出(含达上限后)
  updateReplayUI();
}

async function apiCall(url, data) {
  const res = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data || {})});
  return res.json();
}

async function newGame() {
  if (gameData && (gameData.records_count || 0) >= MAX_RECORDS) {  // 已达上限: 需先重置
    openLimitModal();
    return;
  }
  const body = {};
  const seed = document.getElementById('seedInput').value.trim();
  if (seed) body.seed = parseInt(seed, 10);
  const resp = await apiCall('api/new', body);
  sessionId = resp.session_id;
  gameData = resp;
  modalShownFor = null;
  revealNum = -1; revealShown = 0; animating = false; lastRound = gameData.round;
  logRnd = -1; logLive = -1;
  hideLog();
  closeModal();
  setButtons(true);
  render();
}

function startAuto() {
  autoRunning = true;
  closeModal();
  const btn = document.getElementById('btnAuto');
  btn.textContent = '⏸ 暂停';
  btn.classList.add('running');
  setButtons(true);
  advance();
}

function stopAuto() {
  autoRunning = false;
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = null;
  if (animTimer) clearTimeout(animTimer);
  animTimer = null;
  animating = false;
  if (gameData?.current_trick && !trickRevealed()) {
    revealShown = gameData.current_trick.played.length;   // 暂停时把当前圈补完
    renderCanvas();
  }
  const btn = document.getElementById('btnAuto');
  btn.textContent = '▶▶ 自动';
  btn.classList.remove('running');
  setButtons(!!sessionId && !gameData?.game_over);
}

function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }

async function resetGame() {
  stopAuto();
  closeLimitModal();
  if (sessionId) await apiCall('api/reset', {session_id: sessionId});
  sessionId = null;
  gameData = null;
  modalShownFor = null;
  revealNum = -1; revealShown = 0; animating = false; lastRound = -1;
  logRnd = -1; logLive = -1;
  hideLog();
  closeModal();
  setButtons(false);
  syncStatus();
  renderCanvas();
}

document.getElementById('btnStart').addEventListener('click', newGame);
document.getElementById('btnStep').addEventListener('click', doStep);
document.getElementById('btnPrev').addEventListener('click', doPrev);
document.getElementById('btnAuto').addEventListener('click', toggleAuto);
document.getElementById('btnGames').addEventListener('click', openGames);
document.getElementById('btnExport').addEventListener('click', doExport);
document.getElementById('btnLog').addEventListener('click', toggleLog);
document.getElementById('btnLive').addEventListener('click', doLive);
document.getElementById('gamesClose').addEventListener('click', closeGames);
document.getElementById('logClose').addEventListener('click', hideLog);
document.getElementById('btnReset').addEventListener('click', resetGame);
document.getElementById('modalContinue').addEventListener('click', doStep);
document.getElementById('limitClose').addEventListener('click', closeLimitModal);
document.getElementById('limitExport').addEventListener('click', doExport);
document.getElementById('limitReset').addEventListener('click', resetGame);
document.getElementById('speedSel').addEventListener('change', e => { speed = parseInt(e.target.value, 10) || 400; });
canvas.addEventListener('click', () => {
  if (!sessionId || gameData?.game_over) return;
  autoRunning ? stopAuto() : doStep();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); autoRunning ? stopAuto() : doStep(); }
  if (e.code === 'KeyN') { e.preventDefault(); newGame(); }
});

resizeCanvas();
</script>
